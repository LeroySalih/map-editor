[project]
name = "mapserver"
version = "0.1.0"
description = "Small backend for the Map & Mission Editor: pupils store and open their own maps."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["mapserver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
