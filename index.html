<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map &amp; Mission Editor</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header>
  <div id="tools">
    <button data-tool="select" class="on">Select</button>
    <button data-tool="hill">Hills</button>
    <button data-tool="wood">Woods</button>
    <button data-tool="desert">Desert</button>
    <button data-tool="sea">Sea</button>
    <button data-tool="river">River</button>
    <button data-tool="road">Road</button>
    <button data-tool="wall">Wall</button>
    <button data-tool="bridge">Bridge</button>
    <button data-tool="port">Port</button>
    <button data-tool="objective">Objective</button>
    <button data-tool="spawn">Spawn</button>
  </div>
  <div id="gen">
    <label>Seed <input id="seed" type="number" value="1" min="0"></label>
    <button id="generate">Generate map</button>
    <button id="undo">Undo</button>
    <button id="delete">Delete</button>
    <button id="clear">Clear all</button>
  </div>
  <div id="auth">
    <button id="signin">Sign in with DINO</button>
    <button id="save-remote" hidden>Save to my account</button>
    <button id="save-new" hidden>Save as new</button>
    <button id="my-maps" hidden>My maps</button>
    <span id="who" hidden></span>
    <button id="signout" hidden>Sign out</button>
    <span id="auth-msg" role="status"></span>
  </div>
  <div id="io">
    <button id="new-map">New map</button>
    <button id="save">Save .json</button>
    <button id="load">Load</button>
    <button id="export-svg">SVG</button>
    <button id="export-png">PNG</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </div>
</header>
<main>
  <div id="sheet"></div>
  <aside>
    <label>Title <input id="title" type="text"></label>
    <label>Mission rules <textarea id="rules" rows="6"></textarea></label>
    <label class="check">Background <input id="bg" type="color" value="#e9dfc7"> <button id="bg-reset" type="button">Reset</button></label>
    <label class="check"><input id="grid" type="checkbox"> 2 cm hex grid</label>
    <p id="hint">Click a piece, or drag a box around several. Shift adds to the selection. Delete removes it.</p>
  </aside>
</main>
<dialog id="mymaps">
  <h2>My maps</h2>
  <p id="mymaps-msg" role="status"></p>
  <ul id="mymaps-list"></ul>
  <button id="mymaps-close">Close</button>
</dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
